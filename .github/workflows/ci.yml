name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ワークフロー全体のデフォルト権限を最小限 (contents: read) に制限する。
# 各ジョブはリポジトリのチェックアウト以外に GITHUB_TOKEN を利用しないため、
# 書き込み権限を持たせない。
permissions:
  contents: read

# 同一ワークフロー・同一 ref (PR ブランチや main) で新しいジョブが起動したら、
# 進行中の古いジョブをキャンセルする。連続 push 時の実行枠の無駄を抑える。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-gateway/requirements.txt
      - run: pip install -r requirements.txt
      - run: flake8 app/ tests/ --max-line-length=120
      - run: pytest -v

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: health-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: health-checker/go.sum
      - run: go vet ./...
      - run: go test -v ./...

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: alert-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # package-lock.json は現状 git 管理外なので、cache キーには
          # package.json のハッシュを使う（lockfile 追加後に自動追従する）。
          cache: npm
          cache-dependency-path: alert-service/package.json
      # lockfile が無いため `npm ci` は使えない。lockfile が commit された
      # 時点で `npm ci` に切り替えると reproducible build になる。
      - run: npm install
      - run: npm run lint
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-python, test-go, test-typescript]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
