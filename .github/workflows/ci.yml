name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ワークフロー全体のデフォルト権限を最小化する（OpenSSF Scorecard 準拠）。
# 本 CI はコード取得と静的解析 / テスト実行 / ローカル docker build のみで、
# Issue / PR / Deployment / Pages / Packages への書き込みは行わない。
permissions:
  contents: read

# 同一ワークフロー・同一 ref (PR ブランチや main) で新しいジョブが起動したら、
# 進行中の古いジョブをキャンセルする。連続 push 時の実行枠の無駄を削減する。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-gateway/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt flake8
      - name: Lint (flake8)
        run: flake8 app/ tests/ --max-line-length=120
      - name: Test (pytest)
        run: pytest -v

  test-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: health-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: health-checker/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v ./...

  test-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: alert-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # alert-service/.node-version が "22" のためこれと揃える。
          # Node 20 は GitHub Actions で deprecation 警告が出るので避ける。
          node-version: "22"
          # `alert-service/package-lock.json` が存在しないため npm cache は
          # 有効化しない（cache-dependency-path の解決が失敗するため）。
      - name: Install dependencies
        # Makefile の `npm install --silent` と揃える。`npm ci` は
        # package-lock.json 必須で失敗するため使わない。
        run: npm install --no-audit --no-fund
      - name: Lint (eslint)
        run: npm run lint
      - name: Test (jest)
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test-python, test-go, test-typescript]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose build
        run: docker compose build
