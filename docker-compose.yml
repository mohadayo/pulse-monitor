services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - HEALTH_CHECKER_URL=http://health-checker:8001
      - ALERT_SERVICE_URL=http://alert-service:8002
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      - health-checker
      - alert-service

  health-checker:
    build: ./health-checker
    ports:
      - "8001:8001"
    environment:
      - CHECKER_PORT=8001
      - LOG_LEVEL=INFO
      - API_GATEWAY_URL=http://api-gateway:8000
      - ALERT_SERVICE_URL=http://alert-service:8002
      - CHECK_TIMEOUT=5s
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  alert-service:
    build: ./alert-service
    ports:
      - "8002:8002"
    environment:
      - ALERT_PORT=8002
      - LOG_LEVEL=INFO
      - API_GATEWAY_URL=http://api-gateway:8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
